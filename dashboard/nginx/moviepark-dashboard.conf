server {
    listen 80;
    listen [::]:80;
    server_name moviepark.becloudly.eu 176.96.137.51;
    location ^~ /.well-known/acme-challenge/ { root /var/www/moviepark-acme; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://moviepark.becloudly.eu$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name moviepark.becloudly.eu;
    ssl_certificate /etc/nginx/ssl/moviepark-cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/moviepark-cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MovieParkTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
    location ^~ /images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 176.96.137.51;
    ssl_certificate /etc/letsencrypt/live/176.96.137.51/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/176.96.137.51/privkey.pem;
    return 301 https://moviepark.becloudly.eu$request_uri;
}
